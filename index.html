<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlap</title>
<link rel="stylesheet" href="style.css">

<!-- PWA: ホーム画面追加・スタンドアロン表示・テーマカラー -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
<link rel="icon" href="favicon.png?v=3" type="image/png">

<!-- iOSはmanifest.jsonのicons/表示モードを読まないため個別に指定 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Overlap">
</head>
<body>
<header class="app-header">
  <div class="app-topline">
    <h1 class="app-name">Overlap</h1>
    <span id="edition-label" class="edition-label"></span>
  </div>
  <!-- 大きな日付をタップすると日付の選択が開く(透明の select を日付の上に重ねている) -->
  <label class="date-picker" for="date-select">
    <span id="date-big" class="date-big" aria-hidden="true">&nbsp;</span>
    <select id="date-select" aria-label="日付を選ぶ"></select>
  </label>
</header>

<nav class="tab-bar" role="tablist" aria-label="表示の切り替え">
  <button type="button" class="tab-btn is-active" role="tab" aria-selected="true" data-tab="daily">デイリー</button>
  <button type="button" class="tab-btn" role="tab" aria-selected="false" data-tab="jpyc">JPYC<span id="jpyc-badge" class="tab-badge" hidden></span></button>
</nav>

<main id="app">
<div id="daily-view">
  <section id="matched-section" class="section">
    <h2 class="section-title">両ソースが報じたニュース</h2>
    <div id="matched-list" class="card-list">
      <p class="loading">読み込み中…</p>
    </div>
  </section>

  <section id="nhk-only-section" class="section">
    <h2 class="section-title">NHKのみが報じたニュース</h2>
    <div id="nhk-only-list" class="brief-list">
      <p class="loading">読み込み中…</p>
    </div>
  </section>

  <section id="yahoo-only-section" class="section">
    <h2 class="section-title">Yahoo!のみが報じたニュース</h2>
    <div id="yahoo-only-list" class="brief-list">
      <p class="loading">読み込み中…</p>
    </div>
  </section>
</div>

<!-- JPYCタブ: jpyc-news-v2(卒業論文の研究データ)の recent_events.json を読み込むだけ。jpyc.js 参照 -->
<div id="jpyc-view" hidden>
  <p id="jpyc-status" class="jpyc-status"><span>JPYCの更新状況を確認中…</span></p>
  <div id="jpyc-content"><p class="loading">読み込み中…</p></div>
  <p class="jpyc-footer"><a id="jpyc-research-link" href="#" target="_blank" rel="noopener">研究用の集計ダッシュボードを開く →</a></p>
  <div id="jpyc-toast" class="jpyc-toast" role="status" aria-live="polite" hidden></div>
</div>
</main>

<script src="app.js"></script>
<script src="jpyc.js"></script>
</body>
</html>
