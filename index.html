<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デイリーニュースダイジェスト</title>
<link rel="stylesheet" href="style.css">

<!-- PWA: ホーム画面追加・スタンドアロン表示・テーマカラー -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d47a1">
<link rel="icon" href="favicon.png?v=3" type="image/png">

<!-- iOSはmanifest.jsonのicons/表示モードを読まないため個別に指定 -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ニュース">
</head>
<body>
<header class="app-header">
  <h1>デイリーニュースダイジェスト</h1>
  <p class="app-subtitle">NHK・Yahoo!ニュースを突き合わせた毎日のニュース要約</p>
  <div class="date-picker">
    <label for="date-select">日付</label>
    <select id="date-select"></select>
  </div>
</header>

<main id="app">
  <section id="matched-section" class="section">
    <h2 class="section-title">両ソースが報じたニュース</h2>
    <div id="matched-list" class="card-list">
      <p class="loading">読み込み中…</p>
    </div>
  </section>

  <section id="nhk-only-section" class="section">
    <h2 class="section-title">NHKのみが報じたニュース</h2>
    <div id="nhk-only-list" class="card-list">
      <p class="loading">読み込み中…</p>
    </div>
  </section>

  <section id="yahoo-only-section" class="section">
    <h2 class="section-title">Yahoo!のみが報じたニュース</h2>
    <div id="yahoo-only-list" class="card-list">
      <p class="loading">読み込み中…</p>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
